<title>Biscuit — the talking dog</title>
<style>
  :root {
    --ground: #eef3ea;
    --card: #ffffff;
    --ink: #26301f;
    --ink-soft: #5d6a52;
    --line: #d6ddcc;
    --ball: #9fb020;        /* tennis-ball accent */
    --ball-ink: #45500a;
    --collar: #c4453c;
    --fur: #8a6b4d;
    --fur-dark: #6d5238;
    --belly: #d9c3a5;
    --bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1c211b;
      --card: #262d24;
      --ink: #e8ecdf;
      --ink-soft: #a4af97;
      --line: #3a4437;
      --ball: #b7c837;
      --ball-ink: #1c210a;
      --bubble: #313a2e;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1c211b;
    --card: #262d24;
    --ink: #e8ecdf;
    --ink-soft: #a4af97;
    --line: #3a4437;
    --ball: #b7c837;
    --ball-ink: #1c210a;
    --bubble: #313a2e;
  }
  :root[data-theme="light"] {
    --ground: #eef3ea;
    --card: #ffffff;
    --ink: #26301f;
    --ink-soft: #5d6a52;
    --line: #d6ddcc;
    --ball: #9fb020;
    --ball-ink: #45500a;
    --bubble: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .stage {
    width: min(30rem, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: 1.75rem 1.75rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  h1 {
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, Comfortaa, system-ui, sans-serif;
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .state-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ball-ink);
    background: var(--ball);
    border-radius: 999px;
    padding: 0.3rem 0.75rem;
    white-space: nowrap;
  }

  .bubble {
    position: relative;
    background: var(--bubble);
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    padding: 0.8rem 1rem;
    min-height: 3.2rem;
    display: flex;
    align-items: center;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 3rem;
    bottom: -0.55rem;
    width: 1rem;
    height: 1rem;
    background: var(--bubble);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  .bubble.quiet { color: var(--ink-soft); font-style: italic; }

  .dog-wrap {
    display: flex;
    justify-content: center;
    padding: 0.5rem 0 0.25rem;
  }
  svg { max-width: 100%; height: auto; }

  .tail { transform-origin: 24px 118px; }
  .head { transform-origin: 150px 80px; }
  .tongue { opacity: 0; }
  .eye-open { opacity: 1; }
  .eye-shut { opacity: 0; }
  .zzz { opacity: 0; font: 700 18px ui-rounded, system-ui, sans-serif; fill: var(--ink-soft); }

  @keyframes wag      { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
  @keyframes wag-hard { from { transform: rotate(-30deg); } to { transform: rotate(34deg); } }
  @keyframes yap      { from { transform: rotate(0deg); }  to { transform: rotate(-6deg); } }
  @keyframes bob      { from { transform: translateY(0); } to { transform: translateY(3px); } }
  @keyframes floatz   { from { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  .stage[data-state="idle"]     .tail { animation: wag 0.6s ease-in-out infinite alternate; }
  .stage[data-state="excited"]  .tail { animation: wag-hard 0.18s linear infinite alternate; }
  .stage[data-state="excited"]  .head { animation: yap 0.3s ease-in-out infinite alternate; }
  .stage[data-state="excited"]  .tongue { opacity: 1; }
  .stage[data-state="talking"]  .tail { animation: wag 0.4s ease-in-out infinite alternate; }
  .stage[data-state="talking"]  .head { animation: yap 0.22s ease-in-out infinite alternate; }
  .stage[data-state="eating"]   .head { animation: bob 0.35s ease-in-out infinite alternate; }
  .stage[data-state="eating"]   .tongue { opacity: 1; }
  .stage[data-state="sleeping"] .eye-open { opacity: 0; }
  .stage[data-state="sleeping"] .eye-shut { opacity: 1; }
  .stage[data-state="sleeping"] .zzz { animation: floatz 2.4s ease-in-out infinite; }
  .stage[data-state="sleeping"] .zzz.z2 { animation-delay: 0.8s; }
  .stage[data-state="sleeping"] .zzz.z3 { animation-delay: 1.6s; }

  @media (prefers-reduced-motion: reduce) {
    .tail, .head, .zzz { animation: none !important; }
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: 0.6rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 0.7rem;
    padding: 0.65rem 0.5rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--ball); }
  button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
  button.primary {
    background: var(--ball);
    border-color: var(--ball);
    color: var(--ball-ink);
  }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .foot label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
</style>

<main class="stage" id="stage" data-state="idle">
  <header>
    <h1>Biscuit</h1>
    <span class="state-chip" id="stateChip">state: idle</span>
  </header>

  <div class="bubble quiet" id="bubble">…waiting by the door with a leash in his mouth.</div>

  <div class="dog-wrap">
    <svg viewBox="0 0 240 160" width="300" role="img" aria-label="A cartoon dog named Biscuit">
      <g class="tail">
        <path d="M28 118 Q6 104 12 84" stroke="var(--fur-dark)" stroke-width="10" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="95" cy="120" rx="62" ry="32" fill="var(--fur)"/>
      <ellipse cx="95" cy="130" rx="40" ry="18" fill="var(--belly)"/>
      <rect x="55" y="138" width="12" height="18" rx="6" fill="var(--fur-dark)"/>
      <rect x="118" y="138" width="12" height="18" rx="6" fill="var(--fur-dark)"/>
      <g class="head">
        <ellipse cx="152" cy="78" rx="40" ry="34" fill="var(--fur)"/>
        <path d="M120 52 Q108 74 122 88 Q128 66 134 56 Z" fill="var(--fur-dark)"/>
        <path d="M182 50 Q196 70 184 86 Q178 64 172 54 Z" fill="var(--fur-dark)"/>
        <ellipse cx="168" cy="88" rx="16" ry="11" fill="var(--belly)"/>
        <circle cx="176" cy="84" r="6" fill="#2b2018"/>
        <g class="eye-open">
          <circle cx="142" cy="70" r="4.5" fill="#2b2018"/>
          <circle cx="164" cy="68" r="4.5" fill="#2b2018"/>
        </g>
        <g class="eye-shut">
          <path d="M137 70 q5 4 10 0" stroke="#2b2018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M159 68 q5 4 10 0" stroke="#2b2018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <path class="tongue" d="M166 96 q4 12 -4 14 q-8 -2 -4 -14 Z" fill="var(--collar)"/>
      </g>
      <path d="M116 96 q10 12 24 8" stroke="var(--collar)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <text class="zzz z1" x="196" y="42">z</text>
      <text class="zzz z2" x="208" y="30">z</text>
      <text class="zzz z3" x="220" y="18">z</text>
    </svg>
  </div>

  <div class="controls">
    <button class="primary" id="btnSpeak">Speak</button>
    <button id="btnPet">Pet</button>
    <button id="btnFeed">Feed</button>
    <button id="btnSleep">Sleep</button>
  </div>

  <div class="foot">
    <span id="hint">Click Speak to hear him.</span>
    <label><input type="checkbox" id="voiceToggle" checked> Voice</label>
  </div>
</main>

<script>
  const stage = document.getElementById('stage');
  const chip = document.getElementById('stateChip');
  const bubble = document.getElementById('bubble');
  const voiceToggle = document.getElementById('voiceToggle');

  const PHRASES = [
    "Bark bark! I mean — hello!",
    "I have been a good boy for 47 consecutive minutes.",
    "The mail carrier and I have unfinished business.",
    "Ball? Ball. Ball! BALL!",
    "I would die for you. Also, drop that sandwich.",
    "The vacuum is my enemy and I am winning.",
    "Squirrel status: being monitored.",
    "You smell like you've met other dogs. Explain.",
  ];

  let state = 'idle';
  let revertTimer = null;

  function setState(next, line, quiet) {
    state = next;
    stage.dataset.state = next;
    chip.textContent = 'state: ' + next;
    bubble.textContent = line;
    bubble.classList.toggle('quiet', !!quiet);
    document.getElementById('btnSleep').textContent = next === 'sleeping' ? 'Wake up' : 'Sleep';
  }

  function settleBackToIdle(afterMs) {
    clearTimeout(revertTimer);
    revertTimer = setTimeout(() => {
      if (state !== 'sleeping') setState('idle', '…tail wagging, awaiting further instructions.', true);
    }, afterMs);
  }

  function say(text) {
    if (!voiceToggle.checked || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.pitch = 1.4;
    u.rate = 1.05;
    speechSynthesis.speak(u);
  }

  document.getElementById('btnSpeak').addEventListener('click', () => {
    const line = PHRASES[Math.floor(Math.random() * PHRASES.length)];
    setState('talking', line);
    say(line);
    settleBackToIdle(4000);
  });

  document.getElementById('btnPet').addEventListener('click', () => {
    setState('excited', 'Yes yes yes yes yes. Right behind the ear. YES.');
    settleBackToIdle(3500);
  });

  document.getElementById('btnFeed').addEventListener('click', () => {
    setState('eating', '*inhales kibble* …was there food just now? More?');
    settleBackToIdle(3500);
  });

  document.getElementById('btnSleep').addEventListener('click', () => {
    if (state === 'sleeping') {
      setState('idle', '*stretches* Reporting for duty.', false);
      settleBackToIdle(3000);
    } else {
      clearTimeout(revertTimer);
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      setState('sleeping', '…dreaming of an infinitely long tennis ball.', true);
    }
  });
</script>
