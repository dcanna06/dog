<title>Biscuit — the talking dog</title>
<style>
  :root {
    --ground: #eef3ea;
    --card: #ffffff;
    --ink: #26301f;
    --ink-soft: #5d6a52;
    --line: #d6ddcc;
    --ball: #9fb020;        /* tennis-ball accent */
    --ball-ink: #45500a;
    --collar: #c4453c;
    --fur: #8a6b4d;
    --fur-dark: #6d5238;
    --belly: #d9c3a5;
    --bubble: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #1c211b;
      --card: #262d24;
      --ink: #e8ecdf;
      --ink-soft: #a4af97;
      --line: #3a4437;
      --ball: #b7c837;
      --ball-ink: #1c210a;
      --bubble: #313a2e;
    }
  }
  :root[data-theme="dark"] {
    --ground: #1c211b;
    --card: #262d24;
    --ink: #e8ecdf;
    --ink-soft: #a4af97;
    --line: #3a4437;
    --ball: #b7c837;
    --ball-ink: #1c210a;
    --bubble: #313a2e;
  }
  :root[data-theme="light"] {
    --ground: #eef3ea;
    --card: #ffffff;
    --ink: #26301f;
    --ink-soft: #5d6a52;
    --line: #d6ddcc;
    --ball: #9fb020;
    --ball-ink: #45500a;
    --bubble: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .stage {
    width: min(30rem, 100%);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 1.25rem;
    padding: 1.75rem 1.75rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  h1 {
    font-family: ui-rounded, "Hiragino Maru Gothic ProN", Quicksand, Comfortaa, system-ui, sans-serif;
    font-size: 1.5rem;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .state-chip {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ball-ink);
    background: var(--ball);
    border-radius: 999px;
    padding: 0.3rem 0.75rem;
    white-space: nowrap;
  }

  .bubble {
    position: relative;
    background: var(--bubble);
    border: 1px solid var(--line);
    border-radius: 0.9rem;
    padding: 0.8rem 1rem;
    min-height: 3.2rem;
    display: flex;
    align-items: center;
    font-size: 1.05rem;
    line-height: 1.4;
  }
  .bubble::after {
    content: "";
    position: absolute;
    left: 3rem;
    bottom: -0.55rem;
    width: 1rem;
    height: 1rem;
    background: var(--bubble);
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    transform: rotate(45deg);
  }
  .bubble.quiet { color: var(--ink-soft); font-style: italic; }

  .dog-wrap {
    display: flex;
    justify-content: center;
    padding: 0.5rem 0 0.25rem;
  }
  svg { max-width: 100%; height: auto; }

  .tail { transform-origin: 24px 118px; }
  .head { transform-origin: 150px 80px; }
  .tongue { opacity: 0; }
  .eye-open { opacity: 1; }
  .eye-shut { opacity: 0; }
  .zzz { opacity: 0; font: 700 18px ui-rounded, system-ui, sans-serif; fill: var(--ink-soft); }

  @keyframes wag      { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }
  @keyframes wag-hard { from { transform: rotate(-30deg); } to { transform: rotate(34deg); } }
  @keyframes yap      { from { transform: rotate(0deg); }  to { transform: rotate(-6deg); } }
  @keyframes bob      { from { transform: translateY(0); } to { transform: translateY(3px); } }
  @keyframes floatz   { from { opacity: 0; transform: translateY(4px); } 50% { opacity: 1; } to { opacity: 0; transform: translateY(-8px); } }

  .stage[data-state="idle"]     .tail { animation: wag 0.6s ease-in-out infinite alternate; }
  .stage[data-state="excited"]  .tail { animation: wag-hard 0.18s linear infinite alternate; }
  .stage[data-state="excited"]  .head { animation: yap 0.3s ease-in-out infinite alternate; }
  .stage[data-state="excited"]  .tongue { opacity: 1; }
  .stage[data-state="talking"]  .tail { animation: wag 0.4s ease-in-out infinite alternate; }
  .stage[data-state="talking"]  .head { animation: yap 0.22s ease-in-out infinite alternate; }
  .stage[data-state="eating"]   .head { animation: bob 0.35s ease-in-out infinite alternate; }
  .stage[data-state="eating"]   .tongue { opacity: 1; }
  .stage[data-state="sleeping"] .eye-open { opacity: 0; }
  .stage[data-state="sleeping"] .eye-shut { opacity: 1; }
  .stage[data-state="sleeping"] .zzz { animation: floatz 2.4s ease-in-out infinite; }
  .stage[data-state="sleeping"] .zzz.z2 { animation-delay: 0.8s; }
  .stage[data-state="sleeping"] .zzz.z3 { animation-delay: 1.6s; }

  @media (prefers-reduced-motion: reduce) {
    .tail, .head, .zzz { animation: none !important; }
  }

  .controls {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
    gap: 0.6rem;
  }
  button {
    font: inherit;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 0.7rem;
    padding: 0.65rem 0.5rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--ball); }
  button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
  button.primary {
    background: var(--ball);
    border-color: var(--ball);
    color: var(--ball-ink);
  }

  .composer {
    display: flex;
    gap: 0.5rem;
  }
  .composer input[type="text"] {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--ink);
    background: var(--bubble);
    border: 1.5px solid var(--line);
    border-radius: 0.7rem;
    padding: 0.65rem 0.8rem;
  }
  .composer input[type="text"]::placeholder { color: var(--ink-soft); }
  .composer input[type="text"]:focus-visible,
  .composer button:focus-visible { outline: 2px solid var(--ball); outline-offset: 2px; }
  .icon-btn { padding: 0.65rem 0.8rem; line-height: 1; }
  .icon-btn[aria-pressed="true"] {
    background: var(--collar);
    border-color: var(--collar);
    color: #fff;
  }
  button[disabled] { opacity: 0.5; cursor: not-allowed; }

  .bubble.pending { color: var(--ink-soft); }
  @keyframes pulse { from { opacity: 0.35; } to { opacity: 1; } }
  .bubble.pending::before {
    content: "";
    width: 0.5rem;
    height: 0.5rem;
    margin-right: 0.5rem;
    border-radius: 50%;
    background: var(--ball);
    animation: pulse 0.7s ease-in-out infinite alternate;
  }
  @media (prefers-reduced-motion: reduce) {
    .bubble.pending::before { animation: none; }
  }

  .foot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }
  .foot label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
</style>

<main class="stage" id="stage" data-state="idle">
  <header>
    <h1>Biscuit</h1>
    <span class="state-chip" id="stateChip">state: idle</span>
  </header>

  <div class="bubble quiet" id="bubble">…waiting by the door with a leash in his mouth.</div>

  <div class="dog-wrap">
    <svg viewBox="0 0 240 160" width="300" role="img" aria-label="A cartoon dog named Biscuit">
      <g class="tail">
        <path d="M28 118 Q6 104 12 84" stroke="var(--fur-dark)" stroke-width="10" fill="none" stroke-linecap="round"/>
      </g>
      <ellipse cx="95" cy="120" rx="62" ry="32" fill="var(--fur)"/>
      <ellipse cx="95" cy="130" rx="40" ry="18" fill="var(--belly)"/>
      <rect x="55" y="138" width="12" height="18" rx="6" fill="var(--fur-dark)"/>
      <rect x="118" y="138" width="12" height="18" rx="6" fill="var(--fur-dark)"/>
      <g class="head">
        <ellipse cx="152" cy="78" rx="40" ry="34" fill="var(--fur)"/>
        <path d="M120 52 Q108 74 122 88 Q128 66 134 56 Z" fill="var(--fur-dark)"/>
        <path d="M182 50 Q196 70 184 86 Q178 64 172 54 Z" fill="var(--fur-dark)"/>
        <ellipse cx="168" cy="88" rx="16" ry="11" fill="var(--belly)"/>
        <circle cx="176" cy="84" r="6" fill="#2b2018"/>
        <g class="eye-open">
          <circle cx="142" cy="70" r="4.5" fill="#2b2018"/>
          <circle cx="164" cy="68" r="4.5" fill="#2b2018"/>
        </g>
        <g class="eye-shut">
          <path d="M137 70 q5 4 10 0" stroke="#2b2018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <path d="M159 68 q5 4 10 0" stroke="#2b2018" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        </g>
        <path class="tongue" d="M166 96 q4 12 -4 14 q-8 -2 -4 -14 Z" fill="var(--collar)"/>
      </g>
      <path d="M116 96 q10 12 24 8" stroke="var(--collar)" stroke-width="7" fill="none" stroke-linecap="round"/>
      <text class="zzz z1" x="196" y="42">z</text>
      <text class="zzz z2" x="208" y="30">z</text>
      <text class="zzz z3" x="220" y="18">z</text>
    </svg>
  </div>

  <form class="composer" id="composer">
    <input type="text" id="input" placeholder="Say something to Biscuit…" autocomplete="off" aria-label="Say something to Biscuit">
    <button type="button" class="icon-btn" id="btnMic" aria-pressed="false" title="Talk to him">🎤</button>
    <button type="submit" class="primary" id="btnSend">Send</button>
  </form>

  <div class="controls">
    <button id="btnPet">Pet</button>
    <button id="btnFeed">Feed</button>
    <button id="btnTrick">Trick</button>
    <button id="btnSleep">Sleep</button>
  </div>

  <div class="foot">
    <span id="hint">He's listening.</span>
    <label><input type="checkbox" id="voiceToggle" checked> Voice</label>
  </div>
</main>

<script>
  const stage = document.getElementById('stage');
  const chip = document.getElementById('stateChip');
  const bubble = document.getElementById('bubble');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const btnSend = document.getElementById('btnSend');
  const btnMic = document.getElementById('btnMic');
  const btnSleep = document.getElementById('btnSleep');
  const voiceToggle = document.getElementById('voiceToggle');
  const hint = document.getElementById('hint');

  const STATES = ['idle', 'talking', 'excited', 'eating', 'sleeping'];

  // One conversation per tab. Biscuit remembers it until the server restarts.
  let sessionId = sessionStorage.getItem('biscuitSession');
  if (!sessionId) {
    sessionId = crypto.randomUUID();
    sessionStorage.setItem('biscuitSession', sessionId);
  }

  let state = 'idle';
  let busy = false;

  function setState(next) {
    state = STATES.includes(next) ? next : 'idle';
    stage.dataset.state = state;
    chip.textContent = 'state: ' + state;
    btnSleep.textContent = state === 'sleeping' ? 'Wake up' : 'Sleep';
  }

  function setLine(text, { quiet = false, pending = false } = {}) {
    bubble.textContent = text;
    bubble.classList.toggle('quiet', quiet);
    bubble.classList.toggle('pending', pending);
  }

  function setBusy(next) {
    busy = next;
    btnSend.disabled = next;
    for (const button of document.querySelectorAll('.controls button')) {
      button.disabled = next;
    }
    chip.textContent = next ? 'state: listening…' : 'state: ' + state;
  }

  function speak(text) {
    if (!voiceToggle.checked || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.pitch = 1.4;
    utterance.rate = 1.05;
    speechSynthesis.speak(utterance);
  }

  async function say(message) {
    if (busy) return;
    setBusy(true);
    setLine('Biscuit is thinking about it…', { pending: true });

    let response;
    try {
      response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sessionId, message }),
      });
    } catch {
      setLine("Can't reach the kennel. Start the server with `npm start`, then try again.", { quiet: true });
      setBusy(false);
      return;
    }

    const data = await response.json().catch(() => ({}));
    setBusy(false);

    if (!response.ok) {
      setLine(data.error ?? `The server answered ${response.status}. Check its logs.`, { quiet: true });
      return;
    }

    if (data.sessionId) {
      sessionId = data.sessionId;
      sessionStorage.setItem('biscuitSession', sessionId);
    }
    setState(data.state);
    setLine(data.line);
    speak(data.line);
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message) return;
    input.value = '';
    say(message);
  });

  document.getElementById('btnPet').addEventListener('click', () => say('*scratches you behind the ear*'));
  document.getElementById('btnFeed').addEventListener('click', () => say('*puts down a bowl of kibble*'));
  document.getElementById('btnTrick').addEventListener('click', () => say('Show me a trick!'));

  // Sleep is a local toggle — no need to bother Claude to close his eyes.
  btnSleep.addEventListener('click', () => {
    if (busy) return;
    if (state === 'sleeping') {
      setState('idle');
      setLine('*stretches* Reporting for duty.');
    } else {
      if ('speechSynthesis' in window) speechSynthesis.cancel();
      setState('sleeping');
      setLine('…dreaming of an infinitely long tennis ball.', { quiet: true });
    }
  });

  // Speech-to-text uses the browser's Web Speech API (Chrome and Edge today).
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    btnMic.disabled = true;
    btnMic.title = 'Your browser has no speech recognition — type to him instead';
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    let listening = false;

    const setListening = (next) => {
      listening = next;
      btnMic.setAttribute('aria-pressed', String(next));
      hint.textContent = next ? 'Listening — say something.' : "He's listening.";
    };

    btnMic.addEventListener('click', () => {
      if (listening) {
        recognition.stop();
      } else {
        try {
          recognition.start();
          setListening(true);
        } catch {
          setListening(false);
        }
      }
    });

    recognition.addEventListener('result', (event) => {
      const transcript = event.results[0][0].transcript.trim();
      if (transcript) say(transcript);
    });
    recognition.addEventListener('end', () => setListening(false));
    recognition.addEventListener('error', (event) => {
      setListening(false);
      hint.textContent = event.error === 'not-allowed'
        ? 'Microphone blocked — allow it in your browser to talk to him.'
        : `Microphone error: ${event.error}`;
    });
  }
</script>
